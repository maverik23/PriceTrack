# PriceTrack en producción / self-hosted (Portainer, servidor casero, VPS…)
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Abre http://<tu-servidor>:8090. Variables opcionales (en .env o en Portainer):
#   PRICETRACK_PORT   puerto publicado (8090)
#   APP_URL           URL pública, ej. http://192.168.1.10:8090
#   APP_TIMEZONE      zona horaria (America/Mexico_City)
#   DB_PASSWORD       contraseña de MySQL (cámbiala si expones el servidor)
#   APP_KEY           opcional: si no se define se genera una sola vez y se guarda en el volumen
#   BARCODE_LOOKUP    false para no buscar en internet los datos de un código de barras (true)
#   PRICE_FETCH_BROWSER_URL  navegador para tiendas que bloquean (http://browser:3000; vacío = no usarlo)
#   MCP_ENABLED       false para quitar /mcp, el servidor MCP para asistentes de IA (true)
#   MCP_TOKEN         si se define, /mcp exige "Authorization: Bearer <token>"
#   API_ENABLED       false para quitar /api/v1, la API REST de la app móvil (true)
#   API_TOKEN         si se define, /api/v1 exige "Authorization: Bearer <token>"

name: pricetrack

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pricetrack:latest
    # Reconstruir siempre la imagen al desplegar (Portainer "Pull and redeploy")
    pull_policy: build
    container_name: pricetrack
    restart: unless-stopped
    ports:
      - "${PRICETRACK_PORT:-8090}:80"
    environment:
      APP_NAME: PriceTrack
      APP_URL: ${APP_URL:-http://localhost:8090}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: en
      APP_KEY: ${APP_KEY:-}
      BARCODE_LOOKUP: ${BARCODE_LOOKUP:-true}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: pricetrack
      DB_USERNAME: pricetrack
      DB_PASSWORD: ${DB_PASSWORD:-pricetrack}
      SESSION_DRIVER: database
      CACHE_STORE: database
      # La cola corre dentro del contenedor (docker/entrypoint.sh): actualizar todos los precios en segundo plano
      QUEUE_CONNECTION: database
      # Navegador real para leer precios de Walmart, Sam's, Amazon… (servicio "browser")
      PRICE_FETCH_BROWSER_URL: ${PRICE_FETCH_BROWSER_URL:-http://browser:3000}
      # Servidor MCP para asistentes de IA (http://<servidor>:8090/mcp)
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_TOKEN: ${MCP_TOKEN:-}
      # API REST para la app móvil (http://<servidor>:8090/api/v1)
      API_ENABLED: ${API_ENABLED:-true}
      API_TOKEN: ${API_TOKEN:-}
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: pricetrack-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pricetrack
      MYSQL_USER: pricetrack
      MYSQL_PASSWORD: ${DB_PASSWORD:-pricetrack}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u pricetrack -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Chromium real (con ventana en una pantalla virtual) para las tiendas que bloquean
  # a los programas. Sin puerto publicado: solo lo usa la app. Ver docker/browser.
  browser:
    build:
      context: ./docker/browser
    image: pricetrack-browser:latest
    pull_policy: build
    container_name: pricetrack-browser
    restart: unless-stopped
    # xvfb-run no sirve como PID 1: se cuelga esperando a Xvfb y nunca arranca node
    init: true
    shm_size: "1gb"
    environment:
      TZ: ${APP_TIMEZONE:-America/Mexico_City}

volumes:
  storage:
  db:
