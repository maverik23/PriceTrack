# PriceTrack en producción / self-hosted (Portainer, servidor casero, VPS…)
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Abre http://<tu-servidor>:8090. Variables opcionales (en .env o en Portainer):
#   PRICETRACK_PORT   puerto publicado (8090)
#   APP_URL           URL pública, ej. http://192.168.1.10:8090
#   APP_TIMEZONE      zona horaria (America/Mexico_City)
#   DB_PASSWORD       contraseña de MySQL (cámbiala si expones el servidor)
#   APP_KEY           opcional: si no se define se genera una sola vez y se guarda en el volumen

name: pricetrack

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pricetrack:latest
    container_name: pricetrack
    restart: unless-stopped
    ports:
      - "${PRICETRACK_PORT:-8090}:80"
    environment:
      APP_NAME: PriceTrack
      APP_URL: ${APP_URL:-http://localhost:8090}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: en
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: pricetrack
      DB_USERNAME: pricetrack
      DB_PASSWORD: ${DB_PASSWORD:-pricetrack}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: pricetrack-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pricetrack
      MYSQL_USER: pricetrack
      MYSQL_PASSWORD: ${DB_PASSWORD:-pricetrack}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u pricetrack -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  storage:
  db:
